openapi: 3.0.3
info:
  title: 'CourtKu API'
  description: 'The API behind CourtKu: venues, courts, prices, live availability, bookings and online payments for badminton, futsal and pickleball courts in Malaysia.'
  version: 1.0.0
servers:
  -
    url: 'https://courtku.vercel.app'
tags:
  -
    name: 'Account and login'
    description: ''
  -
    name: 'Venues (public)'
    description: ''
  -
    name: 'Bookings (players)'
    description: ''
  -
    name: Payments
    description: ''
  -
    name: 'Venue setup (owners)'
    description: ''
  -
    name: 'Day schedule (staff)'
    description: ''
  -
    name: 'Staff invites'
    description: ''
  -
    name: 'Reports (owners)'
    description: ''
  -
    name: Admin
    description: ''
  -
    name: Health
    description: ''
components:
  securitySchemes:
    default:
      type: apiKey
      name: X-XSRF-TOKEN
      in: header
      description: 'CourtKu uses a login session cookie, not API tokens (ADR-004). Call <code>GET /sanctum/csrf-cookie</code>, then <code>POST /auth/login</code>; the browser keeps the session cookie, and every request that changes something sends the <code>XSRF-TOKEN</code> cookie back in the <code>X-XSRF-TOKEN</code> header. Owners and the admin also need two-factor login.'
security:
  -
    default: []
paths:
  /auth/login:
    post:
      summary: 'Attempt to authenticate a new session.'
      operationId: attemptToAuthenticateANewSession
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                remember:
                  type: string
                  description: ''
                  example: null
              required:
                - email
                - password
      security: []
  /auth/logout:
    post:
      summary: 'Destroy an authenticated session.'
      operationId: destroyAnAuthenticatedSession
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/forgot-password:
    post:
      summary: 'Send a reset link to the given user.'
      operationId: sendAResetLinkToTheGivenUser
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /auth/reset-password:
    post:
      summary: "Reset the user's password."
      operationId: resetTheUsersPassword
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - token
                - password
      security: []
  /auth/register:
    post:
      summary: 'Create a new registered user.'
      operationId: createANewRegisteredUser
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  '/auth/email/verify/{id}/{hash}':
    get:
      summary: "Mark the authenticated user's email address as verified."
      operationId: markTheAuthenticatedUsersEmailAddressAsVerified
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the verify.'
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /auth/email/verification-notification:
    post:
      summary: 'Send a new email verification notification.'
      operationId: sendANewEmailVerificationNotification
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/user/profile-information:
    put:
      summary: "Update the user's profile information."
      operationId: updateTheUsersProfileInformation
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/user/password:
    put:
      summary: "Update the user's password."
      operationId: updateTheUsersPassword
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/user/confirmed-password-status:
    get:
      summary: 'Get the password confirmation status.'
      operationId: getThePasswordConfirmationStatus
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/user/confirm-password:
    post:
      summary: "Confirm the user's password."
      operationId: confirmTheUsersPassword
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/two-factor-challenge:
    post:
      summary: 'Attempt to authenticate a new session using the two factor authentication code.'
      operationId: attemptToAuthenticateANewSessionUsingTheTwoFactorAuthenticationCode
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                recovery_code:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
      security: []
  /auth/user/two-factor-authentication:
    post:
      summary: 'Enable two factor authentication for the user.'
      operationId: enableTwoFactorAuthenticationForTheUser
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
    delete:
      summary: 'Disable two factor authentication for the user.'
      operationId: disableTwoFactorAuthenticationForTheUser
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/user/confirmed-two-factor-authentication:
    post:
      summary: 'Enable two factor authentication for the user.'
      operationId: enableTwoFactorAuthenticationForTheUser
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/user/two-factor-qr-code:
    get:
      summary: "Get the SVG element for the user's two factor authentication QR code."
      operationId: getTheSVGElementForTheUsersTwoFactorAuthenticationQRCode
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/user/two-factor-secret-key:
    get:
      summary: "Get the current user's two factor authentication setup / secret key."
      operationId: getTheCurrentUsersTwoFactorAuthenticationSetupSecretKey
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /auth/user/two-factor-recovery-codes:
    get:
      summary: 'Get the two factor authentication recovery codes for authenticated user.'
      operationId: getTheTwoFactorAuthenticationRecoveryCodesForAuthenticatedUser
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
    post:
      summary: 'Generate a fresh set of two factor authentication recovery codes.'
      operationId: generateAFreshSetOfTwoFactorAuthenticationRecoveryCodes
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /sanctum/csrf-cookie:
    get:
      summary: 'Return an empty response simply to trigger the storage of the CSRF cookie in the browser.'
      operationId: returnAnEmptyResponseSimplyToTriggerTheStorageOfTheCSRFCookieInTheBrowser
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Account and login'
      security: []
  /api/v1/me:
    get:
      summary: ''
      operationId: getApiV1Me
      description: ''
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - 'Account and login'
    delete:
      summary: 'DELETE /api/v1/me  { "password": ".'
      operationId: dELETEapiv1mepassword
      description: "..\" }: delete my own account (NFR-07, ADR-033).\nThe password is asked again, so someone at an unlocked laptop can't do it in one click."
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - 'Account and login'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - password
  /api/v1/venues:
    get:
      summary: "GET /api/v1/venues?sport=badminton&state=selangor&q=cheras&page=2: the venues guests can book,\nfor the list on the home page (ADR-031). Only approved venues with at least one bookable court."
      operationId: gETapiv1venuessportbadmintonstateselangorqcheraspage2TheVenuesGuestsCanBookForTheListOnTheHomePageADR031OnlyApprovedVenuesWithAtLeastOneBookableCourt
      description: 'Real venues come first, then the demo venues (ADR-030); 24 per page.'
      parameters: []
      responses: {}
      tags:
        - 'Venues (public)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sport:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                state:
                  type: string
                  description: ''
                  example: melaka
                  enum:
                    - johor
                    - kedah
                    - kelantan
                    - melaka
                    - negeri-sembilan
                    - pahang
                    - perak
                    - perlis
                    - pulau-pinang
                    - sabah
                    - sarawak
                    - selangor
                    - terengganu
                    - kuala-lumpur
                    - labuan
                    - putrajaya
                  nullable: true
                q:
                  type: string
                  description: 'Must not be greater than 60 characters.'
                  example: 'n'
                  nullable: true
      security: []
  '/api/v1/venues/{venue_slug}':
    get:
      summary: "GET /api/v1/venues/{slug}: everything the venue's public page shows."
      operationId: gETapiv1venuesslugEverythingTheVenuesPublicPageShows
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Venues (public)'
      security: []
    parameters:
      -
        in: path
        name: venue_slug
        description: "The venue's web address name (slug)."
        example: arena-demo
        required: true
        schema:
          type: string
  '/api/v1/venues/{venue_slug}/courts':
    get:
      summary: 'GET /api/v1/venues/{slug}/courts: the courts players can book.'
      operationId: gETapiv1venuesslugcourtsTheCourtsPlayersCanBook
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Venues (public)'
      security: []
    parameters:
      -
        in: path
        name: venue_slug
        description: "The venue's web address name (slug)."
        example: arena-demo
        required: true
        schema:
          type: string
  '/api/v1/venues/{venue_slug}/availability':
    get:
      summary: "GET /api/v1/venues/{slug}/availability?date=2026-11-06&sport=badminton\nEvery bookable court offering the sport, with each half hour players can still book\nand its price. Half hours that have started, or are inside the venue's notice, are left out."
      operationId: gETapiv1venuesslugavailabilitydate20261106sportbadmintonEveryBookableCourtOfferingTheSportWithEachHalfHourPlayersCanStillBookAndItsPriceHalfHoursThatHaveStartedOrAreInsideTheVenuesNoticeAreLeftOut
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Venues (public)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-11-04'
                sport:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                  nullable: true
              required:
                - date
      security: []
    parameters:
      -
        in: path
        name: venue_slug
        description: "The venue's web address name (slug)."
        example: arena-demo
        required: true
        schema:
          type: string
  '/api/v1/venues/{venue_slug}/quote':
    post:
      summary: 'POST /api/v1/venues/{slug}/quote: the total for one booking, adding up each half hour.'
      operationId: pOSTapiv1venuesslugquoteTheTotalForOneBookingAddingUpEachHalfHour
      description: 'The booking page shows this before the player books; M3 uses the same check to book.'
      parameters: []
      responses: {}
      tags:
        - 'Venues (public)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                court_id:
                  type: integer
                  description: ''
                  example: 16
                starts_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-11-04T15:46:09'
                minutes:
                  type: integer
                  description: 'Must be between 60 and 180.'
                  example: 61
              required:
                - court_id
                - starts_at
                - minutes
      security: []
    parameters:
      -
        in: path
        name: venue_slug
        description: "The venue's web address name (slug)."
        example: arena-demo
        required: true
        schema:
          type: string
  '/api/v1/venues/{venue_slug}/bookings':
    post:
      summary: "POST /api/v1/venues/{slug}/bookings  (header Idempotency-Key: <a random id per Book press>)\n201 with the new booking; 200 with the same booking when the same key comes again\n(a double tap or a network retry); 409 SLOT_TAKEN when someone was faster."
      operationId: pOSTapiv1venuesslugbookingsheaderIdempotencyKeyaRandomIdPerBookPress201WithTheNewBooking200WithTheSameBookingWhenTheSameKeyComesAgainaDoubleTapOrANetworkRetry409SLOTTAKENWhenSomeoneWasFaster
      description: ''
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - 'Bookings (players)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                court_id:
                  type: integer
                  description: ''
                  example: 16
                sport:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                starts_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-11-04T15:46:09'
                minutes:
                  type: integer
                  description: 'Must be at least 30. Must not be greater than 720.'
                  example: 22
                pay:
                  type: string
                  description: ''
                  example: online
                  enum:
                    - online
                    - counter
              required:
                - court_id
                - sport
                - starts_at
                - minutes
    parameters:
      -
        in: path
        name: venue_slug
        description: "The venue's web address name (slug)."
        example: arena-demo
        required: true
        schema:
          type: string
  '/api/v1/bookings/{code}':
    get:
      summary: "GET /api/v1/bookings/{code}: the player's own booking, e.g. for the confirmation page."
      operationId: gETapiv1bookingscodeThePlayersOwnBookingEgForTheConfirmationPage
      description: "While it waits for payment, CourtKu asks Stripe how the payment stands first (at most every few\nseconds), so the status page shows \"paid\" as soon as Stripe knows, webhook or not."
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - 'Bookings (players)'
    parameters:
      -
        in: path
        name: code
        description: 'The booking code.'
        example: CK-7F3K2
        required: true
        schema:
          type: string
  /api/v1/me/bookings:
    get:
      summary: "GET /api/v1/me/bookings?when=upcoming (soonest first) or ?when=past (latest first, with\ncancelled ones), 20 at a time. The next page is ?cursor=<meta.next_cursor> (plan section 8)."
      operationId: gETapiv1mebookingswhenupcomingsoonestFirstOrwhenpastlatestFirstWithCancelledOnes20AtATimeTheNextPageIscursormetanextCursorplanSection8
      description: ''
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - 'Bookings (players)'
  '/api/v1/bookings/{code}/cancel':
    post:
      summary: "POST /api/v1/bookings/{code}/cancel: the player cancels their own booking (FR-24), until the\nvenue's cutoff (e.g. 24 hours before). The half hours are free for others straight away."
      operationId: pOSTapiv1bookingscodecancelThePlayerCancelsTheirOwnBookingFR24UntilTheVenuesCutoffeg24HoursBeforeTheHalfHoursAreFreeForOthersStraightAway
      description: ''
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - 'Bookings (players)'
    parameters:
      -
        in: path
        name: code
        description: 'The booking code.'
        example: CK-7F3K2
        required: true
        schema:
          type: string
  '/api/v1/bookings/{code}/pay':
    post:
      summary: 'POST /api/v1/bookings/{code}/pay: { "data": { "url": "https://checkout.stripe.com/.'
      operationId: pOSTapiv1bookingscodepaydataurlhttpscheckoutstripecom
      description: "..\" } }\nWhere the player pays for a booking that is waiting for payment: the page already open, or a new\none after a declined card. 409 NOT_AWAITING_PAYMENT once it is paid, cancelled or expired."
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - 'Bookings (players)'
    parameters:
      -
        in: path
        name: code
        description: 'The booking code.'
        example: CK-7F3K2
        required: true
        schema:
          type: string
  /api/v1/webhooks/payments/stripe:
    post:
      summary: ''
      operationId: postApiV1WebhooksPaymentsStripe
      description: ''
      parameters: []
      responses: {}
      tags:
        - Payments
      security: []
  '/api/v1/manage/venues/{venue_id}/payment-account':
    get:
      summary: 'GET /api/v1/manage/venues/{venue}/payment-account: the connected account, or null.'
      operationId: gETapiv1managevenuesvenuepaymentAccountTheConnectedAccountOrNull
      description: 'Until it can take payments, CourtKu asks Stripe again each time, e.g. when the owner comes back from Stripe.'
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - Payments
    delete:
      summary: "DELETE /api/v1/manage/venues/{venue}/payment-account: CourtKu stops using the account, and players\ngo back to paying at the counter. The Stripe account itself stays the venue's. Refused while a\nplayer is paying, so their payment can still be confirmed."
      operationId: dELETEapiv1managevenuesvenuepaymentAccountCourtKuStopsUsingTheAccountAndPlayersGoBackToPayingAtTheCounterTheStripeAccountItselfStaysTheVenuesRefusedWhileAPlayerIsPayingSoTheirPaymentCanStillBeConfirmed
      description: ''
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - Payments
    parameters:
      -
        in: path
        name: venue_id
        description: 'The ID of the venue.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/manage/venues/{venue_id}/payment-account/onboarding':
    post:
      summary: 'POST /api/v1/manage/venues/{venue}/payment-account/onboarding: { "data": { "url": "https://connect.stripe.com/.'
      operationId: pOSTapiv1managevenuesvenuepaymentAccountonboardingdataurlhttpsconnectstripecom
      description: "..\" } }\nWhere the owner goes next: Stripe's own sign-up pages for the venue's account. The first time,\nthe account is made first. Each link works once and for a few minutes, so a new one is made each time."
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - Payments
    parameters:
      -
        in: path
        name: venue_id
        description: 'The ID of the venue.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/manage/venues/{venue_id}/payment-settings':
    put:
      summary: 'PUT /api/v1/manage/venues/{venue}/payment-settings  { "payment_mode": "both", "hold_minutes": 15 }'
      operationId: pUTapiv1managevenuesvenuepaymentSettingspaymentModebothholdMinutes15
      description: ''
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_mode:
                  type: string
                  description: ''
                  example: counter
                  enum:
                    - counter
                    - online
                    - both
                hold_minutes:
                  type: integer
                  description: ''
                  example: 15
                  enum:
                    - 10
                    - 15
                    - 20
                    - 30
              required:
                - payment_mode
                - hold_minutes
    parameters:
      -
        in: path
        name: venue_id
        description: 'The ID of the venue.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/manage/venues/{venue_id}/payments/attention':
    get:
      summary: "GET /api/v1/manage/venues/{venue}/payments/attention: online payments the owner should refund (FR-25),\nnewest first, until they are fully refunded:\n  - money that came in but couldn't confirm the booking (wrong amount, too late, after a cancel, paid twice);\n  - bookings paid online and cancelled afterwards (by the player before the cutoff, or by staff)."
      operationId: gETapiv1managevenuesvenuepaymentsattentionOnlinePaymentsTheOwnerShouldRefundFR25NewestFirstUntilTheyAreFullyRefundedMoneyThatCameInButCouldntConfirmTheBookingwrongAmountTooLateAfterACancelPaidTwiceBookingsPaidOnlineAndCancelledAfterwardsbyThePlayerBeforeTheCutoffOrByStaff
      description: ''
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - Payments
    parameters:
      -
        in: path
        name: venue_id
        description: 'The ID of the venue.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/manage/venues/{venue_id}/payments/{payment_id}/refunds':
    post:
      summary: "POST /api/v1/manage/venues/{venue}/payments/{payment}/refunds  { \"amount_sen\": 2000, \"reason\": \"Paid after the time ran out\" }\nPart refunds are fine; the total can never be more than was paid. Fully refunded = status refunded."
      operationId: pOSTapiv1managevenuesvenuepaymentspaymentrefundsamountSen2000reasonPaidAfterTheTimeRanOutPartRefundsAreFineTheTotalCanNeverBeMoreThanWasPaidFullyRefundedStatusRefunded
      description: ''
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF-TOKEN cookie value}'
          schema:
            type: string
      responses: {}
      tags:
        - Payments
      requestBody:
        required: true
